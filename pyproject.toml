[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfkit"
version = "0.1.0"
description = "Modular CTF Cryptanalysis & Automation Toolkit"
readme = "README.md"
authors = [{ name = "CTF Toolchain Engineering Team" }]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=12.0",
    "pycryptodome>=3.15",
]

[project.optional-dependencies]
full = [
    "gmpy2",
    "sympy",
    "requests",
]

[project.scripts]
ctfkit = "ctfkit.cli.main:cli"
